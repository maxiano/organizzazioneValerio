<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Turni Valerio</title>
  
  <!-- Foglio di Stile Esterno -->
  <link rel="stylesheet" href="style.css">
  
  <!-- SheetJS CDN per esportazione Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <h1>Turni Valerio</h1>
  <div class="subhead">Tocca un giorno per cambiare il turno o registrare uno scambio</div>

  <div class="legend">
    <div class="legend-item"><span class="dot papa"></span> Con Te</div>
    <div class="legend-item"><span class="dot mamma"></span> Con Mamma</div>
  </div>

  <div class="action-buttons">
    <button class="btn-primary" onclick="window.print()">🖨️ Stampa / PDF</button>
    <button class="btn-excel" onclick="exportToExcel()">📊 Esporta Excel</button>
    <button class="btn-reset" onclick="resetOverrides()">🔄 Ripristina Standard</button>
  </div>

  <div class="controls">
    <button onclick="changeMonth(-1)">&lt; Prec</button>
    <div class="month-title" id="monthTitle"></div>
    <button onclick="changeMonth(1)">Succ &gt;</button>
  </div>

  <div class="grid" id="calendarGrid"></div>

  <!-- Logica JavaScript Esterna (Modulo ES6) -->
  <script type="module" src="app.js"></script>
</body>
</html>
