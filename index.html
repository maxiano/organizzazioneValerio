<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Turni Valerio</title>
  
  <!-- Configurazione PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <!-- Supporto iOS/Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Turni Valerio">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Foglio di Stile Esterno -->
  <link rel="stylesheet" href="style.css">
  
  <!-- SheetJS CDN per esportazione Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div class="top-bar">
    <h1>Turni Valerio</h1>
    <button id="themeToggleBtn" class="btn-theme" onclick="toggleDarkMode()">🌙 Scuro</button>
  </div>

  <div class="subhead">Tocca un giorno per il turno, o usa 📝 per note ed eventi</div>

  <div class="legend">
    <div class="legend-item"><span class="dot papa"></span> Con Te</div>
    <div class="legend-item"><span class="dot mamma"></span> Con Mamma</div>
  </div>

  <div class="action-buttons">
    <label for="csvInput" class="btn btn-import">
      <span class="btn-icon">📄</span>
      <span>Carica File CSV</span>
      <input type="file" id="csvInput" accept=".csv" onchange="importFromCSV(event)">
    </label>

    <button type="button" class="btn btn-print" onclick="window.print()">
      <span class="btn-icon">🖨️</span>
      <span>Stampa / PDF</span>
    </button>

    <button type="button" class="btn btn-export" onclick="exportToExcel()">
      <span class="btn-icon">📊</span>
      <span>Esporta Excel</span>
    </button>

    <button type="button" class="btn btn-reset" onclick="resetOverrides()">
      <span class="btn-icon">🔄</span>
      <span>Ripristina Standard</span>
    </button>
  </div>

  <!-- SELETTORE VISTA (GRIGLIA / LISTA) -->
  <div class="view-toggle">
    <button id="btnViewGrid" class="btn-toggle active" onclick="switchView('grid')">📅 Griglia</button>
    <button id="btnViewList" class="btn-toggle" onclick="switchView('list')">📋 Lista Agenda</button>
  </div>

  <!-- FILTRO INTERVALLO DATE E CONTEGGIO TOTALI -->
  <div class="stats-card">
    <h3>📊 Calcolo Giorni per Intervallo</h3>
    <div class="filter-group">
      <label>Da: <input type="date" id="filterStartDate" onchange="calculateStats()"></label>
      <label>A: <input type="date" id="filterEndDate" onchange="calculateStats()"></label>
    </div>
    <div class="stats-results">
      <div class="stat-box papa-box">
        <span>👨 Papà</span>
        <strong id="countPapa">0 giorni</strong>
      </div>
      <div class="stat-box mamma-box">
        <span>👩 Mamma</span>
        <strong id="countMamma">0 giorni</strong>
      </div>
      <div class="stat-box undefined-box">
        <span>❓ Non Assegnati</span>
        <strong id="countUndefined">0 giorni</strong>
      </div>
    </div>
  </div>

  <!-- CONTROLLI MESE / ANNO RAPIDI -->
  <div class="controls">
    <button onclick="changeMonth(-1)">&lt; Prec</button>
    <div class="month-selectors">
      <select id="monthSelect" onchange="onDateSelectChange()"></select>
      <select id="yearSelect" onchange="onDateSelectChange()"></select>
    </div>
    <button onclick="changeMonth(1)">Succ &gt;</button>
  </div>

  <!-- CONTENITORI PER LE DUE VISTE -->
  <div class="grid" id="calendarGrid"></div>
  <div class="list-view" id="calendarList" style="display: none;"></div>

  <!-- MODALE PER GESTIONE NOTE ED EVENTI -->
  <div id="noteModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalDateTitle">Aggiungi Evento / Nota</h3>
      
      <label for="noteCategory">Tipo di Evento:</label>
      <select id="noteCategory">
        <option value="allenamento">⚽ Allenamento / Partita</option>
        <option value="medica">🏥 Visita Medica</option>
        <option value="festa">🎉 Festa / Compleanno</option>
        <option value="scuola">📚 Scuola / Gita</option>
        <option value="generico">📌 Nota Generica</option>
      </select>

      <label for="noteTextInput">Descrizione / Nota:</label>
      <input type="text" id="noteTextInput" placeholder="Es. Partita ore 15:00..." maxlength="40">

      <div class="modal-actions">
        <button class="btn-delete" id="btnDeleteNote" onclick="deleteCurrentNote()">Elimina Nota</button>
        <button onclick="closeNoteModal()">Annulla</button>
        <button class="btn-primary" onclick="saveCurrentNote()">Salva</button>
      </div>
    </div>
  </div>

  <!-- Registrazione Service Worker per PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registrato:', reg.scope))
          .catch((err) => console.error('Errore Service Worker:', err));
      });
    }
  </script>

  <!-- Logica JavaScript Esterna (Modulo ES6) -->
  <script type="module" src="app.js"></script>
</body>
</html>
